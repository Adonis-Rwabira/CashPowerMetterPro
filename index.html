
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>CashPowerMetterPro</title>

    <script>
      // Script de pré-chargement pour éviter le flash de thème (FOUC)
      (function() {
        const THEME_STORAGE_KEY = 'app_theme';
        try {
          const storedTheme = localStorage.getItem(THEME_STORAGE_KEY);
          if (storedTheme === 'light' || storedTheme === 'dark') {
            document.documentElement.classList.add(storedTheme);
          } else if (storedTheme === 'system' || !storedTheme) {
            // Si 'system' est choisi ou rien n'est stocké, on se fie à la préférence du navigateur
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (prefersDark) {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {
          // En cas d'erreur (ex: localStorage désactivé), on ne fait rien
        }
      })();
    </script>

    <style>
      /* CSS du splash screen (identique à avant, utilise maintenant les classes light/dark) */
      :root {
        --splash-bg: #F0F2F5; /* Thème clair par défaut */
        --splash-logo-bg: #FFFFFF;
        --splash-logo-border: rgba(0, 122, 255, 0.3);
        --splash-title-color: #1A202C;
        --splash-progress-bg: #E2E8F0;
        --splash-progress-fill: linear-gradient(to right, #007BFF, #00C6FF);
      }

      :root.dark {
        /* Thème sombre */
        --splash-bg: #0D1015;
        --splash-logo-bg: #13171F;
        --splash-logo-border: rgba(0, 245, 255, 0.25);
        --splash-title-color: #E2E8F0;
        --splash-progress-bg: #222936;
        --splash-progress-fill: linear-gradient(to right, #10B981, #00F5FF);
      }

      body {
        overscroll-behavior: none;
        margin: 0;
        background-color: var(--splash-bg);
      }

      #splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 20px;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: var(--splash-bg);
        opacity: 1;
        transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #splash-logo {
        width: 80px;
        height: 80px;
        padding: 12px;
        border-radius: 1.25rem;
        background-color: var(--splash-logo-bg);
        border: 1px solid var(--splash-logo-border);
        animation: iconPulseGlow 3s ease-in-out infinite;
      }
      #splash-title {
        font-family: 'Geist', sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--splash-title-color);
      }
      #progress-bar {
        width: 150px;
        height: 2px;
        background-color: var(--splash-progress-bg);
        overflow: hidden;
      }
      #progress-bar-fill {
        width: 100%;
        height: 100%;
        background: var(--splash-progress-fill);
        transform: translateX(-100%);
        animation: fillProgress 1.2s 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes iconPulseGlow {
        50% { box-shadow: 0 0 0 1px var(--splash-logo-border), 0 0 35px 2px var(--splash-logo-border); }
      }
      @keyframes fillProgress { to { transform: translateX(0); } }

      body.app-loaded #splash-container {
        opacity: 0;
        pointer-events: none;
      }

      #root { width: 100%; }
    </style>
  </head>
  <body>
    <div id="splash-container">
      <img id="splash-logo" src="/icon.svg" alt="CashPowerMetterPro Logo" />
      <h1 id="splash-title">CashPowerMetterPro</h1>
      <div id="progress-bar"><div id="progress-bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
